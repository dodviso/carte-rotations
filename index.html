<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte PRA - Visualisation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      width: 300px;
      max-height: 90%;
      overflow-y: auto;
    }
    h4 { margin-top: 0; }
    .rotation-item {
      font-size: 0.9em;
      margin-left: 10px;
    }
    .legend {
      position: absolute;
      bottom: 20px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info-panel" id="info">
    <h4>Rotations PRA</h4>
    <p>Cliquez sur une PRA pour afficher ses rotations</p>
  </div>

  <div class="legend">
    <strong>Symbologie</strong><br>
    Selon la part de terres arables par rapport à la SAU
  </div>

  <script>
    let ratioData = {};
    // Initialisation de la carte
    const map = L.map('map').setView([46.6, 2.5], 6); // centre sur la France

    // Fond de carte
    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const infoDiv = document.getElementById("info");
    let praData = {};

    // Charger le JSON des rotations
    Promise.all([
      fetch("data/json_for_map.json").then(r => r.json()),
      new Promise(resolve => {
        Papa.parse("data/260129_indicateurs_par_pra.csv", {
          download: true,
          header: true,
          dynamicTyping: false, // ⚠ important
          complete: function(results) {
            results.data.forEach(row => {
              if (row.ratio === "r2_ta_sau") {
                const code = String(row.code_pra).trim();
                ratioData[code] = parseFloat(row.valeur);
              }
            });
            resolve();
          }
        });
      })
    ]).then(([json]) => {
      praData = json;
      loadGeoJSON();
    });

    function getSoilColor(value) {
      if (value === undefined || value === null) return "#f5f5f5";

      return value > 0.95 ? '#002e12' :
              value > 0.90 ? '#003915' :
              value > 0.85 ? '#00441b' :
              value > 0.80 ? '#004f1f' :
              value > 0.75 ? '#005a24' :
              value > 0.70 ? '#006628' :
              value > 0.65 ? '#0b7730' :
              value > 0.60 ? '#1b7837' :
              value > 0.55 ? '#2c8a3e' :
              value > 0.50 ? '#3c9c45' :
              value > 0.45 ? '#4daf4a' :
              value > 0.40 ? '#5bb85c' :
              value > 0.35 ? '#74c476' :
              value > 0.30 ? '#8dd38f' :
              value > 0.25 ? '#a1d99b' :
              value > 0.20 ? '#b8e3b2' :
              value > 0.15 ? '#ccebc5' :
              value > 0.10 ? '#dff3d9' :
              value > 0.05 ? '#eef9ea' :
                              '#f7fcf5';
      }
    
    function styleFeature(feature) {
      const code = feature.properties.PRA_Code;
      const value = ratioData[code];
      console.log(feature.properties.PRA_Code, ratioData[feature.properties.PRA_Code]);

      return {
        color: "#555",
        weight: 1,
        fillColor: getSoilColor(value),
        fillOpacity: 0.7
      };
    }

    function loadGeoJSON() {
      fetch("data/pra_wgs84.geojson")
        .then(r => r.json())
        .then(geojson => {
          let selectedLayer = null; // pour mémoriser la zone cliquée
            const layer = L.geoJSON(geojson, {
            style: styleFeature,
            onEachFeature: (feature, layer) => {
                layer.on({
                click: (e) => {
                    // Réinitialiser le style de la précédente sélection
                    if (selectedLayer) {
                    geojsonLayer.resetStyle(selectedLayer);
                    }

                    // Mettre en évidence la nouvelle sélection
                    e.target.setStyle({
                    weight: 3,
                    color: '#000',
                    fillOpacity: 0.9
                    });

                    selectedLayer = e.target;

                    // Afficher les infos dans le panneau
                    showInfo(feature);
                },
                mouseover: (e) => {
                    e.target.setStyle({
                    weight: 2,
                    color: '#333',
                    fillOpacity: 0.8
                    });
                },
                mouseout: (e) => {
                    if (selectedLayer !== e.target) {
                    geojsonLayer.resetStyle(e.target);
                    }
                }
                });
            }
            });
            const geojsonLayer = layer.addTo(map);
          map.fitBounds(layer.getBounds());
        });
    }

    function showInfo(feature) {
      const props = feature.properties;
      const praCode = props.PRA_Code;
      const ratioValue = ratioData[praCode];
      const data = praData[praCode];

      let html = `<h4>${props.PRA_Lib}</h4>`;
      html += `<p><strong>TA/SAU :</strong> ${(ratioValue * 100).toFixed(2)} %<br>`;
      html += `<p><strong>Département :</strong> ${props.dep_nom} (${props.insee_dep})<br>`;
      html += `<strong>Région :</strong> ${props.reg_nom} (${props.insee_reg})</p>`;

      if (data) {
        html += `<p><strong>Code PRA :</strong> ${praCode}<br>`;
        html += `<strong>Libellé PRA :</strong> ${data.libelle_pra}<br>`;
        html += `<p><strong>Part top 5 :</strong> ${(data.part_top5 * 100).toFixed(2)} %<br>`;
        html += `<strong>Part top 10 :</strong> ${(data.part_top10 * 100).toFixed(2)} %<br>`;
        html += `<strong>Part top 20 :</strong> ${(data.part_top20 * 100).toFixed(2)} %</p>`;
        //html += `<strong>Part top 50 :</strong> ${(data.part_top50 * 100).toFixed(2)} %</p>`;
        html += `<strong>Nombre de rotations :</strong> ${(data.nb_rotations).toFixed(0)}</p>`;
        html += `<p><strong>Rotations principales :</strong></p>`;
        html += `<ul>`;
        data.rotations.slice(0, 5).forEach(rot => {
          html += `<li class="rotation-item">${rot.rotation_code} : ${(rot.part_rotation * 100).toFixed(2)}%</li>`;
        });
        html += `</ul>`;
      } else {
        html += `<p><em>Aucune donnée trouvée dans json_for_map.json</em></p>`;
      }

      infoDiv.innerHTML = html;
    }
  </script>
</body>
</html>
